<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>大脚板丛のPlog编辑器</title>
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css" rel="stylesheet">
  <style>
    @font-face {
      font-family: "SourceHanSansCNLight";
      src: url("./assets/fonts/SourceHanSansCN-Light.otf") format("opentype");
      font-display: swap;
    }
    @font-face {
      font-family: "IPixCN";
      src: url("./assets/fonts/ipix-zh.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "SourceHanSansCNExtraLight";
      src: url("./assets/fonts/SourceHanSansCN-ExtraLight.otf") format("opentype");
      font-display: swap;
    }
    :root {
      --bg: #fffaf0;
      --surface: rgba(255, 253, 247, 0.96);
      --surface-soft: #fff6e8;
      --accent: #f6b8c9;
      --accent-strong: #da7fa0;
      --ink: #2f2c2a;
      --muted: #8b8177;
      --success: #62a875;
      --line: rgba(140, 111, 96, 0.18);
      --shadow: 0 10px 30px rgba(47, 44, 42, 0.12);
      --toolbar-h: 72px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-sheet: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #fffdf8 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "IPixCN", "LXGW WenKai", "LXGW WenKai TC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    button,
    select,
    input,
    textarea {
      font-family: "IPixCN", "LXGW WenKai", "LXGW WenKai TC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      font-weight: 500;
    }

    .wrap {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 8px) 1px calc(var(--toolbar-h) + env(safe-area-inset-bottom) + 12px);
      display: grid;
      gap: 8px;
      overflow-x: hidden;
    }

    .pixel-card {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: none;
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .header-lite {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 9px 12px 5px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .title-box {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 19px;
      color: var(--accent-strong);
      text-shadow: none;
      letter-spacing: 0;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
    }

    .layout {
      display: grid;
      gap: 10px;
    }

    .row { display: grid; gap: 10px; }
    .editor-main { display: grid; gap: 10px; }
    .editor-card { padding: 10px; }

    label {
      font-size: 13px;
      color: #6a5d4e;
      display: block;
      margin-bottom: 6px;
    }

    textarea,
    select,
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fffdf8;
      padding: 9px;
      font-size: 15px;
      font-family: "IPixCN", "LXGW WenKai", "LXGW WenKai TC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      font-weight: 500;
      color: #332c24;
      outline: none;
    }

    textarea {
      min-height: 0;
      height: 44px;
      resize: none;
      line-height: 1.6;
      overflow-y: hidden;
    }
    input[type="range"] {
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      height: 24px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: #f1e4d4;
      border: 1px solid var(--line);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-top: -8px;
      background: #ffffff;
      border: 2px solid var(--accent-strong);
      box-shadow: none;
    }
    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: #f1e4d4;
      border: 1px solid var(--line);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--accent-strong);
      box-shadow: none;
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .top-main {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }
    .top-main > div:first-child {
      flex: 1;
      min-width: 180px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions-left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      flex: 1;
    }
    .mini-btn {
      padding: 7px 10px;
      font-size: 12px;
      border-color: var(--line);
      background: #fffdf8;
    }
    .ai-box {
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      display: grid;
      gap: 8px;
    }
    .ai-title {
      font-size: 13px;
      color: #6a5d4e;
      font-weight: 700;
    }
    .ai-list {
      margin: 0;
      padding-left: 18px;
      color: #4f4337;
      font-size: 13px;
      line-height: 1.4;
      display: grid;
      gap: 4px;
    }
    .ai-captions {
      display: grid;
      gap: 6px;
    }
    .ai-cap-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .ai-cap-text {
      flex: 1;
      font-size: 13px;
      color: #2f2721;
      background: #fff;
      border: 2px solid #e3cfab;
      border-radius: 8px;
      padding: 6px 8px;
      white-space: pre-wrap;
    }
    .ai-status {
      font-size: 12px;
      color: #756a5d;
    }
    .ai-inline {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .ai-inline > * {
      min-width: 0;
    }
    .ai-style-select {
      flex: 1;
      min-width: 140px;
    }
    .ai-note {
      font-size: 12px;
      color: #7c6e5f;
      line-height: 1.35;
    }
    .save-toast {
      font-size: 12px;
      color: #2f7f45;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 200ms ease, transform 200ms ease;
      min-height: 16px;
    }
    .save-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    details.panel-fold {
      border: 0;
      border-radius: var(--radius-sm);
      background: #fffaf2;
      padding: 8px 0;
    }
    details.panel-fold > summary {
      cursor: pointer;
      font-size: 14px;
      color: var(--ink);
      user-select: none;
      list-style: none;
    }
    details.panel-fold > summary::-webkit-details-marker { display: none; }
    details.panel-fold > summary::before {
      content: '▸ ';
      color: var(--accent-strong);
    }
    details.panel-fold[open] > summary::before { content: '▾ '; }
    .multi-toolbar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 12px);
      z-index: 39;
      background: rgba(34, 30, 25, 0.92);
      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 12px;
      padding: 8px;
      display: none;
      gap: 6px;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.24);
    }
    .multi-toolbar.show { display: inline-flex; }
    .export-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .export-modal.show { display: flex; }
    .export-card {
      width: min(560px, 100%);
      max-height: calc(100dvh - 28px);
      overflow: auto;
      background: #fffdf3;
      border: 3px solid #f1c8b6;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .export-img {
      width: 100%;
      border: 2px solid #d7c4ad;
      border-radius: 8px;
      background: #f6f6f6;
    }
    .export-tip {
      margin: 0;
      color: #5c5248;
      font-size: 13px;
      line-height: 1.45;
    }
    .export-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      font-family: "IPixCN", "LXGW WenKai", "LXGW WenKai TC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      font-weight: 500;
      background: #fffdf8;
      color: #2e2a25;
      box-shadow: none;
    }

    button:active {
      transform: translateY(1px);
    }

    .pink {
      background: #ffe5ed;
      border-color: rgba(218, 127, 160, 0.35);
    }

    .green {
      background: #edf8ee;
      border-color: rgba(98, 168, 117, 0.35);
    }

    .blue {
      background: #eef8fb;
      border-color: rgba(96, 149, 170, 0.28);
    }

    .yellow {
      background: #fff2d8;
      border-color: rgba(189, 169, 114, 0.28);
    }

    .preview-card {
      position: relative;
      border: 1px solid rgba(218, 127, 160, 0.35);
      border-radius: 8px;
      padding: 0;
      width: 100%;
      overflow: hidden;
      touch-action: pan-y;
      background: transparent;
      box-shadow: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      touch-action: pan-y;
    }
    .empty-state {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: #6e6962;
      font-size: 18px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.75);
    }
    .empty-state.show {
      display: flex;
    }
    .add-main-image-btn {
      pointer-events: auto;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fffef7;
      color: #4f4439;
      font-size: 36px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      padding: 0;
    }
    .add-main-image-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 #c6b07d;
    }

    .bottom-toolbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 34;
      height: calc(var(--toolbar-h) + env(safe-area-inset-bottom));
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255, 253, 248, 0.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .tool-btn {
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 4px 2px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }
    .tool-btn .tool-icon {
      font-size: 22px;
      line-height: 1;
    }
    .tool-btn.active {
      color: var(--accent-strong);
      background: rgba(246, 184, 201, 0.16);
      border-radius: 12px;
    }
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 36;
      background: rgba(47, 44, 42, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .sheet-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 37;
      max-height: min(76dvh, 720px);
      padding: 10px 14px calc(16px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      box-shadow: var(--shadow);
      transform: translateY(105%);
      transition: transform 220ms ease;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .bottom-sheet.show {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: rgba(47, 44, 42, 0.18);
      margin: 0 auto 10px;
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-title {
      font-size: 17px;
      font-weight: 700;
    }
    .sheet-close {
      border: 0;
      background: transparent;
      padding: 6px;
      color: var(--muted);
      font-size: 20px;
    }
    .sheet-section {
      display: grid;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .sheet-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .sheet-tabs button {
      font-size: 12px;
      padding: 7px 4px;
      background: #fff8ef;
    }
    .style-manager {
      display: none;
      gap: 10px;
      padding-top: 10px;
    }
    .style-manager.show {
      display: grid;
    }
    .canvas-counter {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      min-height: 0;
      display: none;
    }
    .canvas-counter.show {
      display: block;
    }

    body.immersive-text-mode {
      overflow: hidden;
      touch-action: none;
    }

    body.immersive-text-mode .bottom-toolbar,
    body.immersive-text-mode .bottom-sheet,
    body.immersive-text-mode .sheet-backdrop,
    body.immersive-text-mode .canvas-counter {
      opacity: 0;
      pointer-events: none;
    }

    body.immersive-text-mode .wrap {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .immersive-text-editor {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.02) 26%, rgba(0,0,0,0.22));
    }
    .immersive-text-editor.show {
      display: block;
    }
    .immersive-done {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      right: 14px;
      z-index: 64;
      width: auto;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: #171413;
      font-size: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
      pointer-events: auto;
    }
    .immersive-input {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 62;
      width: 1px;
      height: 1px;
      min-height: 1px;
      max-height: 1px;
      transform: translateX(-50%);
      opacity: 0;
      color: transparent;
      caret-color: #ffffff;
      background: transparent;
      border: 0;
      outline: 0;
      resize: none;
      pointer-events: none;
      line-height: 1.35;
    }
    .immersive-size-wrap {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      top: 22svh;
      bottom: calc(var(--immersive-keyboard-offset, 0px) + 132px + env(safe-area-inset-bottom));
      z-index: 63;
      width: 54px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .immersive-size-control {
      position: relative;
      width: 54px;
      height: min(48svh, 360px);
      min-height: 190px;
      touch-action: none;
    }
    .immersive-size-track {
      position: absolute;
      inset: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      clip-path: polygon(18% 0, 82% 0, 57% 100%, 43% 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.26));
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.18));
    }
    .immersive-size-knob {
      position: absolute;
      left: 50%;
      top: calc(var(--immersive-size-pos, 0.18) * 100%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #ffffff;
      box-shadow: 0 3px 12px rgba(0,0,0,0.28);
      border: 1px solid rgba(0,0,0,0.12);
    }
    .immersive-size-slider {
      display: none;
    }
    .immersive-toolbar {
      position: fixed;
      left: 50%;
      bottom: calc(var(--immersive-keyboard-offset, 0px) + env(safe-area-inset-bottom) + 12px);
      z-index: 63;
      width: min(94vw, 640px);
      transform: translateX(-50%);
      display: grid;
      gap: 10px;
      pointer-events: auto;
    }
    .immersive-tool-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    .immersive-popover {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255, 250, 239, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    .immersive-tool-btn {
      width: 54px;
      height: 54px;
      min-width: 54px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #fff1d8;
      color: #2c2927;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 14px rgba(0,0,0,0.12);
    }
    .immersive-tool-btn.active {
      background: #f8d4c8;
      color: #171413;
      outline: 1px solid rgba(218, 127, 160, 0.42);
    }
    .tool-icon-palette {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: conic-gradient(#ff6b9c, #ffd76d, #79d4ff, #8bd48a, #ff6b9c);
      border: 3px solid #fff8ea;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.14);
    }
    .tool-icon-align {
      width: 24px;
      height: 18px;
      display: grid;
      gap: 4px;
    }
    .tool-icon-align span {
      display: block;
      height: 2px;
      border-radius: 999px;
      background: #2c2927;
    }
    .tool-icon-align span:nth-child(2) { width: 70%; }
    .immersive-tool-btn[data-align="center"] .tool-icon-align span {
      justify-self: center;
    }
    .immersive-tool-btn[data-align="right"] .tool-icon-align span {
      justify-self: end;
    }
    .immersive-tool-btn[data-align="left"] .tool-icon-align span {
      justify-self: start;
    }
    .tool-icon-box-a {
      width: 27px;
      height: 24px;
      border: 2px solid #2c2927;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
    }
    .immersive-popover {
      justify-content: flex-start;
      overflow-x: auto;
      display: none;
      scrollbar-width: none;
    }
    .immersive-popover.show {
      display: flex;
    }
    .immersive-popover::-webkit-scrollbar {
      display: none;
    }
    .color-swatch {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.92);
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      padding: 0;
    }
    .font-pill,
    .style-pill {
      flex: 0 0 auto;
      width: auto;
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.74);
      color: #2c2927;
      font-size: 12px;
      box-shadow: none;
    }
    .font-pill.active,
    .style-pill.active {
      background: #f8d4c8;
      color: #171413;
    }

    @media (max-width: 760px) {

  <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
  <script>

    const FONT_MAP = {

      // Legacy key kept for backward compatibility with older saved states.

    };
    const FONT_FAMILIES = FONT_MAP;

    const STYLE_CONFIGS = {

      },

        radius: 0,
        padX: 9,

        padBottom: 6

      textShadowBlur: 0
      },

    };

    };
    const SCALE_UI = {

      max: 12
    };

    const STORAGE_SELECTED_FONT = 'plog_editor_selected_font_v1';

    const STORAGE_ACTIVE_STYLE_PROFILE = 'plog_active_style_profile_v1';

    const imageInput = document.getElementById('imageInput');

    const overlayInput = document.getElementById('overlayInput');

    const alignRightBtn = document.getElementById('alignRightBtn');

    const closeExportModalBtn = document.getElementById('closeExportModalBtn');
    const immersiveTextEditor = document.getElementById('immersiveTextEditor');
    const immersiveDoneBtn = document.getElementById('immersiveDoneBtn');

    const immersiveSizeControl = document.getElementById('immersiveSizeControl');

    const immersiveStylePicker = document.getElementById('immersiveStylePicker');

    let baseImage = null;
    let baseImageSrc = '';
    let activeImageIndex = 0;
    let imageCount = 1;
    let aiLoading = false;
    let saveToastTimer = null;
    let sheetTouchStartY = 0;
    let styleProfiles = [];
    let activeStyleProfileId = '';

    // text: { text, x, y, scale, angle }
    let textLayers = [];
    // overlay: { src, img, x, y, w, h, angle }
    let overlayLayers = [];

    let selected = null; // { kind: 'text'|'overlay', index: number }
    let multiSelected = [];
    let interaction = null;

    let textLayouts = [];
    let overlayLayouts = [];
    let activeGuides = [];
    let snapState = { x: null, y: null, hapticKey: '' };
    let suppressPlaceholderText = false;

    let previousFontValue = 'builtin-sourcehan-light';

    const fontLoadCache = new Set();
    const activeTouchPoints = new Map();
    let longPressTimer = null;
    let longPressTriggered = false;
    const LONG_PRESS_MS = 380;
    const TAP_MOVE_TOLERANCE = 6;
    const IMMERSIVE_COLORS = ['#ffffff', '#000000', '#ff5d9d', '#ffdd68', '#7fdcff', '#8fda8f', '#ff8f66', '#c9a7ff'];
    const ALIGN_MODES = ['left', 'center', 'right'];

    let isApplyingHistory = false;
    let immersiveEditIndex = -1;
    let immersiveCreatedCount = 0;
    let immersiveDirty = false;
    let lastTextTapAt = 0;
    let lastTextTapIndex = -1;
    const historyStack = [];
    const redoStack = [];
    const globalStyle = {
      styleId: 'nobg',
      fontId: 'builtin-sourcehan-light',
      panelAlpha: 1
    };

    function getStyleConfig(styleId) {
      return STYLE_CONFIGS[styleId || styleSelect.value] || STYLE_CONFIGS.blackwhite;
    }

    function updateControlUISize() {
      const mobile = window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 860;
      CONTROL_UI.selectionGap = mobile ? 30 : 10;
      CONTROL_UI.resizeHandleSize = mobile ? 40 : 20;
      CONTROL_UI.rotateHandleRadius = mobile ? 40 : 16;
      CONTROL_UI.deleteHandleRadius = mobile ? 40 : 16;
      CONTROL_UI.hitRadius = mobile ? 40 : 20; // fixed ~80px touch target on mobile
      CONTROL_UI.minFrameW = mobile ? 200 : 160;
      CONTROL_UI.minFrameH = mobile ? 120 : 90;
    }

    function getFontStack() {
      return FONT_FAMILIES[fontSelect.value] || FONT_FAMILIES['builtin-sourcehan-light'];
    }

    async function ensureFontReady(fontId) {
      if (!document.fonts || !document.fonts.load) return;
      const id = fontId || 'builtin-sourcehan-light';
      if (fontLoadCache.has(id)) return;
      const stack = FONT_FAMILIES[id] || FONT_FAMILIES['builtin-sourcehan-light'];
      const match = stack.match(/"([^"]+)"/);
      const family = match ? match[1] : stack.split(',')[0].trim().replace(/^['"]|['"]$/g, '');
      if (!family) return;
      try {
        await Promise.all([
          document.fonts.load(`400 64px "${family}"`, '测试Aa'),
          document.fonts.load(`700 64px "${family}"`, '测试Aa')
        ]);
        fontLoadCache.add(id);
      } catch (_) {
        // keep fallback if font cannot be loaded immediately
      }
    }

    function isMobileUI() {
      return window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 860;
    }

    function getSelectedTextLayer() {
      if (!selected || selected.kind !== 'text' || !textLayers[selected.index]) return null;
      return textLayers[selected.index];
    }

    function getEffectiveStyleId(layer) {
      return layer.styleOverride || globalStyle.styleId;
    }

    function getEffectiveFontId(layer) {
      return layer.fontOverride || globalStyle.fontId;
    }

    function getEffectivePanelAlpha(layer) {
      if (typeof layer.panelAlphaOverride === 'number') return Math.max(0, Math.min(1, layer.panelAlphaOverride));
      return Math.max(0, Math.min(1, globalStyle.panelAlpha));
    }

    function drawPlaceholder() {
      updatePreviewFrameForCanvas();
      ctx.fillStyle = '#f2f2f2';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawImageCover(img) {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }

    function setCanvasSizeFromImage(img) {
      if (!img) return;
      if (canvas.width !== img.width || canvas.height !== img.height) {
        canvas.width = img.width;
        canvas.height = img.height;
      }
      updatePreviewFrameForCanvas();
    }

    function updatePreviewFrameForCanvas() {
      const preview = canvas.parentElement;
      if (!preview) return;
      const maxW = Math.max(140, preview.clientWidth - 2);
      const ratio = canvas.width / canvas.height;
      let drawW = maxW;
      let drawH = drawW / ratio;
      canvas.style.width = `${drawW}px`;
      canvas.style.height = `${drawH}px`;
    }

    function applyOverlay() {
      // Keep original image clean. No global style overlay applied.
    }

    function syncEmptyState() {
      if (!emptyState) return;
      emptyState.classList.toggle('show', !baseImage);
    }

    function updateCanvasCounter() {
      if (!canvasCounter) return;
      if (imageCount > 1) {
        canvasCounter.textContent = `${activeImageIndex + 1} / ${imageCount}`;
        canvasCounter.classList.add('show');
      } else {
        canvasCounter.textContent = '';
        canvasCounter.classList.remove('show');
      }
    }

    function setActiveTool(tool) {
      imageToolBtn.classList.toggle('active', tool === 'image');
      textToolBtn.classList.toggle('active', tool === 'text');
      aiToolBtn.classList.toggle('active', tool === 'ai');
    }

    function closeSheets() {
      [imageSheet, textSheet, aiSheet].forEach((sheet) => {
        sheet.classList.remove('show');
        sheet.setAttribute('aria-hidden', 'true');
      });
      sheetBackdrop.classList.remove('show');
      setActiveTool('');
    }

    function openSheet(kind) {
      closeSheets();
      const target = kind === 'image' ? imageSheet : (kind === 'text' ? textSheet : aiSheet);
      target.classList.add('show');
      target.setAttribute('aria-hidden', 'false');
      sheetBackdrop.classList.add('show');
      setActiveTool(kind);
      if (kind === 'text') autoGrowBodyInput();
      if (kind === 'ai') autoGrowStyleExamplesInput();
    }

    function saveStyleProfilesToStorage() {
      try {
        localStorage.setItem(STORAGE_STYLE_PROFILES, JSON.stringify(styleProfiles));
        localStorage.setItem(STORAGE_ACTIVE_STYLE_PROFILE, activeStyleProfileId || '');
        return true;
      } catch (_) {
        // ignore quota errors
        return false;
      }
    }

    function loadStyleProfilesFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_STYLE_PROFILES);
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed) && parsed.length) {
          styleProfiles = parsed
            .map((v) => ({
              id: String(v.id || `style-${Math.random().toString(16).slice(2)}`),
              name: String(v.name || '我的风格库').trim() || '我的风格库',
              description: String(v.description || '').trim(),
              examples: Array.isArray(v.examples)
                ? v.examples.map((s) => String(s || '').trim()).filter(Boolean).slice(0, 30)
                : (Array.isArray(v.samples) ? v.samples.map((s) => String(s || '').trim()).filter(Boolean).slice(0, 30) : [])
            }))
            .filter((v) => v.id && v.name !== '丛式默认');
        }
      } catch (_) {
        styleProfiles = [];
      }
      const savedActive = localStorage.getItem(STORAGE_ACTIVE_STYLE_PROFILE) || '';
      activeStyleProfileId = styleProfiles.some((p) => p.id === savedActive) ? savedActive : (styleProfiles[0] ? styleProfiles[0].id : '');
      saveStyleProfilesToStorage();
    }

    function getActiveStyleProfile() {
      if (!styleProfiles.length) return null;
      return styleProfiles.find((p) => p.id === activeStyleProfileId) || styleProfiles[0] || null;
    }

    function parseStyleSamplesInput() {
      const raw = (styleExamplesInput.value || '').trim();
      if (!raw) return [];
      if (raw.startsWith('[')) {
        try {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            return arr.map((v) => String(v || '').trim()).filter(Boolean);
          }
        } catch (_) {}
      }
      return raw.split('\n').map((v) => v.trim()).filter(Boolean);
    }

    function renderStyleProfileUI() {

        opt.value = p.id;
        opt.textContent = p.name;
        styleProfileSelect.appendChild(opt);
      });

      const hasProfile = !!active;
      styleProfileSelect.disabled = !hasProfile;
      styleDescInput.disabled = !hasProfile;
      styleExamplesInput.disabled = !hasProfile;
      saveStyleProfileBtn.disabled = !hasProfile;
      renameStyleProfileBtn.disabled = !hasProfile;
      deleteStyleProfileBtn.disabled = !hasProfile;

        styleDescInput.value = '';
        styleExamplesInput.value = '';

      styleDescInput.value = active.description || '';
      styleExamplesInput.value = (active.examples || []).join('\n');

    function saveCurrentProfileEdits() {

    function getBaseImageForAIDataUrl() {
      if (!baseImage) return '';
      const maxSide = 1600;
      const ratio = Math.min(1, maxSide / Math.max(baseImage.width, baseImage.height));
      const w = Math.max(1, Math.round(baseImage.width * ratio));
      const h = Math.max(1, Math.round(baseImage.height * ratio));
      const temp = document.createElement('canvas');
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext('2d');
      tctx.drawImage(baseImage, 0, 0, w, h);
      return temp.toDataURL('image/jpeg', 0.86);
    }

    async function runAIInspiration() {
      if (aiLoading) return;
      if (!baseImage) {
        alert('请先导入主图，再点 AI找灵感');
        return;
      }
      saveCurrentProfileEdits();
      const activeProfile = getActiveStyleProfile();
      if (!activeProfile) {
        alert('请先新建一个风格库，再生成 AI 文案');
        return;
      }
      const styleExamples = activeProfile ? (activeProfile.examples || []).slice(0, 10) : [];
      if (styleExamples.length < 3) {
        alert('请先在风格库里至少填写 3 条历史文案语料');
        return;
      }
      aiLoading = true;
      aiInspireBtn.disabled = true;
      aiInspireBtn.textContent = '生成中...';
      aiResult.style.display = 'none';
      try {
        const imageDataUrl = getBaseImageForAIDataUrl();
        const resp = await fetch('/api/analyze-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: imageDataUrl,
            style_profile: {
              name: activeProfile ? activeProfile.name : '默认风格',
              description: activeProfile ? (activeProfile.description || '') : '',
              examples: styleExamples
            },
            style_prompt: buildStylePrompt(activeProfile)
          })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data && data.error ? data.error : 'AI 接口调用失败');
        renderAIList(aiDirections, data.directions || []);

        aiLoading = false;
        aiInspireBtn.disabled = false;
        aiInspireBtn.textContent = '✦ 找点东西写';
      }
    }

    function drawRoundedRectPath(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function splitGraphemes(text) {
      if (!text) return [];
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        const seg = new Intl.Segmenter('zh', { granularity: 'grapheme' });
        return Array.from(seg.segment(text), s => s.segment);
      }
      return Array.from(text);
    }

    function isEmojiGrapheme(g) {
      return EMOJI_RE.test(g);
    }

    function measureLineMetrics(text, font, emojiFont, letterSpacing) {
      const gs = splitGraphemes(text);
      if (!gs.length) {
        const fallbackAsc = parseInt(font, 10) * 0.76 || 20;
        const fallbackDesc = parseInt(font, 10) * 0.24 || 6;
        return { minLeft: 0, maxRight: 0, visualWidth: 0, ascent: fallbackAsc, descent: fallbackDesc, graphemes: [] };
      }
      let cursorX = 0;
      let minLeft = Number.POSITIVE_INFINITY;
      let maxRight = Number.NEGATIVE_INFINITY;
      let ascent = 0;
      let descent = 0;
      for (let i = 0; i < gs.length; i += 1) {
        ctx.font = isEmojiGrapheme(gs[i]) ? emojiFont : font;
        const m = ctx.measureText(gs[i]);
        const l = typeof m.actualBoundingBoxLeft === 'number' ? m.actualBoundingBoxLeft : 0;
        const r = typeof m.actualBoundingBoxRight === 'number' ? m.actualBoundingBoxRight : m.width;
        const a = typeof m.actualBoundingBoxAscent === 'number' ? m.actualBoundingBoxAscent : 0;
        const d = typeof m.actualBoundingBoxDescent === 'number' ? m.actualBoundingBoxDescent : 0;
        minLeft = Math.min(minLeft, cursorX - l);
        maxRight = Math.max(maxRight, cursorX + r);
        ascent = Math.max(ascent, a);
        descent = Math.max(descent, d);
        cursorX += m.width;
        if (i < gs.length - 1) cursorX += letterSpacing;
      }
      if (!Number.isFinite(minLeft)) minLeft = 0;
      if (!Number.isFinite(maxRight)) maxRight = 0;
      if (ascent <= 0) ascent = (parseInt(font, 10) || 24) * 0.76;
      if (descent <= 0) descent = (parseInt(font, 10) || 24) * 0.24;
      return { minLeft, maxRight, visualWidth: Math.max(0, maxRight - minLeft), ascent, descent, graphemes: gs };
    }

    function drawTextWithSpacing(text, x, y, font, letterSpacing, emojiFont) {
      const gs = splitGraphemes(text);
      if (!gs.length) return;
      let cursorX = x;
      for (let i = 0; i < gs.length; i += 1) {
        ctx.font = isEmojiGrapheme(gs[i]) ? emojiFont : font;
        ctx.fillText(gs[i], cursorX, y);
        const m = ctx.measureText(gs[i]);
        cursorX += m.width;
        if (i < gs.length - 1) cursorX += letterSpacing;
      }
    }

    function wrapByWidth(text, font, emojiFont, maxWidth, letterSpacing, maxLines) {
      const gs = splitGraphemes(text);
      const lines = [];
      let lineGs = [];
      for (const ch of gs) {
        const testGs = [...lineGs, ch];
        const test = testGs.join('');
        if (measureLineMetrics(test, font, emojiFont, letterSpacing).visualWidth <= maxWidth) {
          lineGs = testGs;
        } else {
          if (lineGs.length) lines.push(lineGs.join(''));
          lineGs = [ch];
          if (lines.length >= maxLines) break;
        }
      }
      if (lineGs.length && lines.length < maxLines) lines.push(lineGs.join(''));
      return lines;
    }

    function wrapWithNewlines(text, font, emojiFont, maxWidth, letterSpacing, maxLines) {
      const paragraphs = String(text || '').split('\n');
      const out = [];
      for (let i = 0; i < paragraphs.length; i += 1) {
        const p = paragraphs[i];
        const wrapped = p ? wrapByWidth(p, font, emojiFont, maxWidth, letterSpacing, maxLines - out.length) : [''];
        for (const line of wrapped) {
          out.push(line);
          if (out.length >= maxLines) return out;
        }
      }
      return out;
    }

    function rotatePoint(localX, localY, angle) {
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      return { x: localX * c - localY * s, y: localX * s + localY * c };
    }

    function localFromWorld(px, py, cx, cy, angle) {
      const dx = px - cx;
      const dy = py - cy;
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      return { x: dx * c + dy * s, y: -dx * s + dy * c };
    }

    function getSelectionControlPoints(layout) {
      const gap = CONTROL_UI.selectionGap;
      const bw = Math.max(layout.w, CONTROL_UI.minFrameW);
      const bh = Math.max(layout.h, CONTROL_UI.minFrameH);
      const fw = bw + gap * 2;
      const fh = bh + gap * 2;
      const tl = rotatePoint(-fw / 2, -fh / 2, layout.angle);
      const tr = rotatePoint(fw / 2, -fh / 2, layout.angle);
      const br = rotatePoint(fw / 2, fh / 2, layout.angle);
      return {
        delete: { x: layout.cx + tl.x, y: layout.cy + tl.y },
        resize: { x: layout.cx + tr.x, y: layout.cy + tr.y },
        rotate: { x: layout.cx + br.x, y: layout.cy + br.y },
        frame: { fw, fh, bw, bh }
      };
    }

    function pointInRotatedLayout(p, layout) {
      const local = localFromWorld(p.x, p.y, layout.cx, layout.cy, layout.angle);
      return Math.abs(local.x) <= layout.w / 2 && Math.abs(local.y) <= layout.h / 2;
    }

    function parseLines() {
      return bodyInput.value.split('\n').map(t => t.trim()).filter(Boolean);
    }

    function autoGrowBodyInput() {
      const viewportH = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
      const maxH = Math.round(viewportH * 0.36);
      bodyInput.style.height = 'auto';
      bodyInput.style.overflowY = 'hidden';
      const target = Math.max(44, Math.min(bodyInput.scrollHeight, maxH));
      bodyInput.style.height = `${target}px`;
      if (bodyInput.scrollHeight > maxH) bodyInput.style.overflowY = 'auto';
    }

    function autoGrowStyleExamplesInput() {
      if (!styleExamplesInput) return;
      const viewportH = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
      const maxH = Math.round(viewportH * 0.26);
      styleExamplesInput.style.height = 'auto';
      styleExamplesInput.style.overflowY = 'hidden';
      const target = Math.max(92, Math.min(styleExamplesInput.scrollHeight, maxH));
      styleExamplesInput.style.height = `${target}px`;
      if (styleExamplesInput.scrollHeight > maxH) styleExamplesInput.style.overflowY = 'auto';
    }

    function makeTextLayer(text, x, y, baseLayer = null, options = {}) {
      const centerX = Math.max(0, Math.round(canvas.width / 2 - 13));
      const centerY = Math.max(0, Math.round(canvas.height / 2 - 28));
      return {
        text,
        x: Math.max(0, Math.min(canvas.width - 26, typeof x === 'number' ? x : centerX)),
        y: Math.max(0, Math.min(canvas.height - 56, typeof y === 'number' ? y : centerY)),
        scale: baseLayer && typeof baseLayer.scale === 'number' ? baseLayer.scale : 1,
        angle: baseLayer && typeof baseLayer.angle === 'number' ? baseLayer.angle : 0,
        styleOverride: baseLayer ? (baseLayer.styleOverride || null) : null,
        fontOverride: baseLayer ? (baseLayer.fontOverride || null) : null,
        panelAlphaOverride: baseLayer && typeof baseLayer.panelAlphaOverride === 'number' ? baseLayer.panelAlphaOverride : null,
        textColorOverride: baseLayer ? (baseLayer.textColorOverride || null) : null,
        align: baseLayer ? (baseLayer.align || 'left') : 'left',
        isPlaceholder: !!options.isPlaceholder
      };
    }

    function syncTextLayers(lines) {
      const next = [];
      for (let i = 0; i < lines.length; i += 1) {
        const prev = textLayers[i];
        if (prev) {
          next.push({ ...prev, text: lines[i] });
        } else {
          next.push(makeTextLayer(lines[i]));
        }
      }
      textLayers = next;
      if (selected && selected.kind === 'text' && selected.index >= textLayers.length) selected = null;
      multiSelected = multiSelected.filter(v => v.kind === 'text' && v.index < textLayers.length);
    }

    function itemKey(item) {
      return `${item.kind}:${item.index}`;
    }

    function getLayoutByItem(item) {
      if (!item) return null;
      return item.kind === 'text' ? (textLayouts[item.index] || null) : (overlayLayouts[item.index] || null);
    }

    function getItemEdges(item) {
      const layout = getLayoutByItem(item);
      return layout ? layoutEdges(layout) : null;
    }

    function getActiveSelectionItems() {
      if (multiSelected.length >= 2) return multiSelected.slice();
      return selected ? [selected] : [];
    }

    function pickTopmostItem(items) {
      let topmost = null;
      let minTop = Number.POSITIVE_INFINITY;
      for (const item of items) {
        const e = getItemEdges(item);
        if (!e) continue;
        if (e.top < minTop) {
          minTop = e.top;
          topmost = item;
        }
      }
      return topmost;
    }

    function drawMultiSelectionFrames() {
      if (!multiSelected.length) return;
      const selectedKey = selected ? itemKey(selected) : '';
      for (const item of multiSelected) {
        if (itemKey(item) === selectedKey) continue;
        const layout = getLayoutByItem(item);
        if (!layout) continue;
        const gap = CONTROL_UI.selectionGap;
        const fw = layout.w + gap * 2;
        const fh = layout.h + gap * 2;
        ctx.save();
        ctx.translate(layout.cx, layout.cy);
        ctx.rotate(layout.angle);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.setLineDash([5, 3]);
        ctx.strokeRect(-fw / 2, -fh / 2, fw, fh);
        ctx.restore();
      }
    }

    function alignSelectedHorizontal(mode) {
      const items = getActiveSelectionItems();
      if (items.length < 2) return;
      const baseItem = pickTopmostItem(items);
      if (!baseItem) return;
      const baseEdges = getItemEdges(baseItem);
      if (!baseEdges) return;

      pushHistory();
      for (const item of items) {
        const edges = getItemEdges(item);
        if (!edges) continue;
        let targetX = edges.left;
        if (mode === 'left') targetX = baseEdges.left;
        if (mode === 'right') targetX = baseEdges.right - edges.w;
        if (mode === 'center') targetX = baseEdges.cx - edges.w / 2;
        targetX = Math.max(0, Math.min(canvas.width - edges.w, targetX));
        if (item.kind === 'text' && textLayers[item.index]) textLayers[item.index].x = targetX;
        if (item.kind === 'overlay' && overlayLayers[item.index]) overlayLayers[item.index].x = targetX;
      }
      render();
      pushHistory();
    }

    function updateMultiToolbar() {
      const show = multiSelected.length >= 2;
      multiToolbar.classList.toggle('show', show);
    }

    function toggleInMultiSelection(item) {
      const key = itemKey(item);
      const idx = multiSelected.findIndex(v => itemKey(v) === key);
      if (idx >= 0) multiSelected.splice(idx, 1);
      else multiSelected.push(item);
      selected = item;
      syncControlsFromSelectedText();
      updateMultiToolbar();
    }

    function clearLongPressTimer() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function updateTouchPoint(e) {
      if (e.pointerType !== 'touch') return;
      activeTouchPoints.set(e.pointerId, pointerToCanvasPoint(e));
    }

    function removeTouchPoint(e) {
      if (e.pointerType !== 'touch') return;
      activeTouchPoints.delete(e.pointerId);
    }

    function getTwoTouchPoints() {
      const points = Array.from(activeTouchPoints.values());
      if (points.length < 2) return null;
      return [points[0], points[1]];
    }

    function drawOverlayLayers() {
      overlayLayouts = [];
      for (let i = 0; i < overlayLayers.length; i += 1) {
        const l = overlayLayers[i];
        l.w = Math.max(40, Math.min(canvas.width - 2, l.w));
        l.h = Math.max(40, Math.min(canvas.height - 2, l.h));
        l.x = Math.max(0, Math.min(canvas.width - l.w, l.x));
        l.y = Math.max(0, Math.min(canvas.height - l.h, l.y));
        if (typeof l.angle !== 'number') l.angle = 0;

        const cx = l.x + l.w / 2;
        const cy = l.y + l.h / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(l.angle);
        ctx.drawImage(l.img, -l.w / 2, -l.h / 2, l.w, l.h);
        ctx.restore();

        overlayLayouts.push({ cx, cy, w: l.w, h: l.h, angle: l.angle });
      }
    }

    function drawTextLayers() {
      textLayouts = [];
      const maxInnerWidth = canvas.width - 30;

      for (let i = 0; i < textLayers.length; i += 1) {
        const layer = textLayers[i];
        if (layer.isPlaceholder && suppressPlaceholderText) {
          textLayouts.push({ cx: layer.x + 13, cy: layer.y + 28, w: 26, h: 56, angle: layer.angle || 0 });
          continue;
        }
        if (typeof layer.angle !== 'number') layer.angle = 0;
        const effectiveStyleId = getEffectiveStyleId(layer);
        const effectiveFontId = getEffectiveFontId(layer);
        const layerStyle = getStyleConfig(effectiveStyleId);
        const fontStack = FONT_FAMILIES[effectiveFontId] || FONT_FAMILIES['builtin-sourcehan-light'];
        const panelAlpha = getEffectivePanelAlpha(layer);
        const textColor = layer.isPlaceholder ? 'rgba(255,255,255,0.72)' : (layer.textColorOverride || layerStyle.textColor);
        const textAlignMode = ALIGN_MODES.includes(layer.align) ? layer.align : 'left';
        const baseFont = isMobileUI() ? FONT_UI.baseMobile : FONT_UI.baseDesktop;
        let fontSize = Math.max(FONT_UI.min, Math.min(FONT_UI.max, Math.round(baseFont * layer.scale)));
        let font = '';
        let emojiFont = '';
        let lines = [];
        let lineMetrics = [];
        const padLeft = layerStyle.usePanel ? (layerStyle.panel.padLeft ?? layerStyle.panel.padX ?? 0) : 0;
        const padRight = layerStyle.usePanel ? (layerStyle.panel.padRight ?? layerStyle.panel.padX ?? 0) : 0;
        const padTop = layerStyle.usePanel ? (layerStyle.panel.padTop || 0) : 0;
        const padBottom = layerStyle.usePanel ? (layerStyle.panel.padBottom || 0) : 0;
        const textOffsetY = layerStyle.textOffsetY || 0;

        for (let step = 0; step < 12; step += 1) {
          font = `${layerStyle.bodyWeight} ${fontSize}px ${fontStack}`;
          emojiFont = `400 ${fontSize}px ${EMOJI_FONT_STACK}`;
          lines = wrapWithNewlines(layer.isPlaceholder ? '双击输入文字' : layer.text, font, emojiFont, maxInnerWidth, layerStyle.letterSpacing, 12);
          lineMetrics = lines.map(v => measureLineMetrics(v, font, emojiFont, layerStyle.letterSpacing));
          const lineW = Math.max(...lineMetrics.map(v => v.visualWidth), 0);
          if (lineW + padLeft + padRight <= canvas.width - 20) break;
          fontSize -= 2;
          if (fontSize <= FONT_UI.min) break;
        }

        const lineHeight = fontSize * (layerStyle.lineHeight || 1.14);
        const lineRects = [];
        let minX = Number.POSITIVE_INFINITY;
        let minY = Number.POSITIVE_INFINITY;
        let maxX = Number.NEGATIVE_INFINITY;
        let maxY = Number.NEGATIVE_INFINITY;
        for (let li = 0; li < lines.length; li += 1) {
          const m = lineMetrics[li];
          const baselineY = li * lineHeight + m.ascent + padTop + textOffsetY;
          const visualLeft = padLeft + m.minLeft;
          const visualRight = padLeft + m.maxRight;
          const textTop = baselineY - m.ascent;
          const textBottom = baselineY + m.descent;
          const boxLeft = layerStyle.usePanel ? (visualLeft - padLeft) : visualLeft;
          const boxRight = layerStyle.usePanel ? (visualRight + padRight) : visualRight;
          const boxTop = layerStyle.usePanel ? (textTop - padTop) : textTop;
          const boxBottom = layerStyle.usePanel ? (textBottom + padBottom) : textBottom;
          const bgW = Math.max(2, boxRight - boxLeft);
          let textStartX = padLeft;
          if (textAlignMode === 'center') textStartX = boxLeft + (bgW - m.visualWidth) / 2 - m.minLeft;
          if (textAlignMode === 'right') textStartX = boxRight - padRight - m.maxRight;
          lineRects.push({
            text: lines[li],
            baselineY,
            textStartX,
            bgX: boxLeft,
            bgY: boxTop,
            bgW,
            bgH: Math.max(2, boxBottom - boxTop)
          });
          minX = Math.min(minX, boxLeft);
          minY = Math.min(minY, boxTop);
          maxX = Math.max(maxX, boxRight);
          maxY = Math.max(maxY, boxBottom);
        }
        if (!Number.isFinite(minX)) minX = 0;
        if (!Number.isFinite(minY)) minY = 0;
        if (!Number.isFinite(maxX)) maxX = 26;
        if (!Number.isFinite(maxY)) maxY = fontSize;
        const shiftX = -minX;
        const shiftY = -minY;
        const boxW = Math.max(26, maxX - minX);
        const boxH = Math.max(24, maxY - minY);

        layer.x = Math.max(0, Math.min(canvas.width - boxW, layer.x));
        layer.y = Math.max(0, Math.min(canvas.height - boxH, layer.y));

        const cx = layer.x + boxW / 2;
        const cy = layer.y + boxH / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(layer.angle);

        ctx.fillStyle = textColor;
        ctx.shadowBlur = layerStyle.textShadowBlur || 0;
        for (let li = 0; li < lineRects.length; li += 1) {
          const ln = lineRects[li];
          const drawLeft = -boxW / 2 + shiftX;
          const drawTop = -boxH / 2 + shiftY;
          if (layerStyle.usePanel && panelAlpha > 0) {
            ctx.fillStyle = `rgba(${layerStyle.panel.rgb},${panelAlpha})`;
            ctx.fillRect(drawLeft + ln.bgX, drawTop + ln.bgY, ln.bgW, ln.bgH);
          }
          ctx.fillStyle = textColor;
          drawTextWithSpacing(ln.text, drawLeft + ln.textStartX, drawTop + ln.baselineY, font, layerStyle.letterSpacing, emojiFont);
        }

        ctx.restore();

        textLayouts.push({ cx, cy, w: boxW, h: boxH, angle: layer.angle });
      }
    }

    function drawSelection() {
      if (!selected) return;
      let layout = null;
      if (selected.kind === 'text') layout = textLayouts[selected.index] || null;
      if (selected.kind === 'overlay') layout = overlayLayouts[selected.index] || null;
      if (!layout) return;

      const controls = getSelectionControlPoints(layout);
      const fw = controls.frame.fw;
      const fh = controls.frame.fh;

      ctx.save();
      ctx.translate(layout.cx, layout.cy);
      ctx.rotate(layout.angle);
      ctx.lineWidth = isMobileUI() ? 5 : 4;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(-fw / 2, -fh / 2, fw, fh);
      ctx.restore();

      // 左上角删除按钮
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(controls.delete.x, controls.delete.y, CONTROL_UI.deleteHandleRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.6;
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 4;
      const crossSize = Math.max(6.5, CONTROL_UI.deleteHandleRadius * 0.38);
      ctx.beginPath();
      ctx.moveTo(controls.delete.x - crossSize, controls.delete.y - crossSize);
      ctx.lineTo(controls.delete.x + crossSize, controls.delete.y + crossSize);
      ctx.moveTo(controls.delete.x + crossSize, controls.delete.y - crossSize);
      ctx.lineTo(controls.delete.x - crossSize, controls.delete.y + crossSize);
      ctx.stroke();
      ctx.restore();

      // 右上角缩放按钮（更小且贴右上角）
      const s = CONTROL_UI.resizeHandleSize;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 4;
      ctx.fillRect(controls.resize.x - s / 2, controls.resize.y - s / 2, s, s);
      ctx.restore();

      // 右下角旋转按钮
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(controls.rotate.x, controls.rotate.y, CONTROL_UI.rotateHandleRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.4;
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 4;
      const ringR = Math.max(6.8, CONTROL_UI.rotateHandleRadius * 0.52);
      ctx.beginPath();
      ctx.arc(controls.rotate.x, controls.rotate.y, ringR, 0.45, 5.45);
      ctx.stroke();
      const arrowOffset = Math.max(4.8, CONTROL_UI.rotateHandleRadius * 0.37);
      const arrowTip = Math.max(9.8, CONTROL_UI.rotateHandleRadius * 0.75);
      const arrowMidY = Math.max(4.1, CONTROL_UI.rotateHandleRadius * 0.32);
      const arrowInner = Math.max(7.1, CONTROL_UI.rotateHandleRadius * 0.55);
      const arrowInnerY = Math.max(0.4, CONTROL_UI.rotateHandleRadius * 0.04);
      ctx.beginPath();
      ctx.moveTo(controls.rotate.x + arrowOffset, controls.rotate.y - (arrowOffset + 0.1));
      ctx.lineTo(controls.rotate.x + arrowTip, controls.rotate.y - arrowMidY);
      ctx.lineTo(controls.rotate.x + arrowInner, controls.rotate.y - arrowInnerY);
      ctx.closePath();
      ctx.fillStyle = '#000000';
      ctx.fill();
      ctx.restore();
    }

    function drawGuides() {
      if (!activeGuides.length) return;
      ctx.save();
      const mobile = isMobileUI();
      const outerW = mobile ? 5.5 : 4;
      const innerW = mobile ? 3.2 : 2.4;
      const dashA = mobile ? [10, 7] : [8, 6];
      const dashB = mobile ? [7, 6] : [6, 5];
      for (const g of activeGuides) {
        // Outer dark stroke for contrast on bright backgrounds.
        ctx.setLineDash(dashA);
        ctx.lineWidth = outerW;
        ctx.strokeStyle = 'rgba(0,0,0,0.75)';
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y1);
        ctx.lineTo(g.x2, g.y2);
        ctx.stroke();

        // Inner bright stroke to make guides pop on dark backgrounds.
        ctx.setLineDash(dashB);
        ctx.lineWidth = innerW;
        ctx.strokeStyle = 'rgba(255,255,255,0.98)';
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y1);
        ctx.lineTo(g.x2, g.y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      updateCanvasCounter();
      if (!baseImage) {
        syncEmptyState();
        drawPlaceholder();
        return;
      }
      syncEmptyState();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawImageCover(baseImage);
      applyOverlay();

      ctx.textAlign = 'left';
      ctx.shadowColor = 'rgba(0,0,0,0.00)';
      ctx.shadowBlur = 0;

      drawOverlayLayers();
      drawTextLayers();
      drawGuides();
      drawMultiSelectionFrames();
      drawSelection();

      ctx.shadowBlur = 0;
    }

    async function loadImageFromSrc(src) {
      return new Promise((resolve, reject) => {
        if (!src) {
          resolve(null);
          return;
        }
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('图片加载失败'));
        img.src = src;
      });
    }

    async function fileToImageSrc(file) {
      const name = (file.name || '').toLowerCase();
      const type = (file.type || '').toLowerCase();
      const isHeic = type.includes('heic') || type.includes('heif') || name.endsWith('.heic') || name.endsWith('.heif');
      if (!isHeic) {
        if (typeof createImageBitmap === 'function') {
          try {
            const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
            const temp = document.createElement('canvas');
            temp.width = bmp.width;
            temp.height = bmp.height;
            const tctx = temp.getContext('2d');
            tctx.drawImage(bmp, 0, 0);
            const normalized = await new Promise((resolve, reject) => {
              temp.toBlob((blob) => {
                if (blob) resolve(blob);
                else reject(new Error('图片格式转换失败'));
              }, 'image/jpeg', 0.98);
            });
            return URL.createObjectURL(normalized);
          } catch (_) {}
        }
        return URL.createObjectURL(file);
      }

      if (typeof window.heic2any !== 'function') {
        throw new Error('当前浏览器未加载 HEIC 转换器，请联网后重试。');
      }
      const output = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.95 });
      const outputBlob = Array.isArray(output) ? output[0] : output;
      return URL.createObjectURL(outputBlob);
    }

    function cloneTextLayers() {
      return textLayers.map(t => ({
        text: t.text,
        x: t.x,
        y: t.y,
        scale: t.scale,
        angle: t.angle || 0,
        styleOverride: t.styleOverride || null,
        fontOverride: t.fontOverride || null,
        panelAlphaOverride: typeof t.panelAlphaOverride === 'number' ? t.panelAlphaOverride : null,
        textColorOverride: t.textColorOverride || null,
        align: t.align || 'left',
        isPlaceholder: !!t.isPlaceholder
      }));
    }

    function cloneOverlayLayers() {
      return overlayLayers.map(o => ({ src: o.src, x: o.x, y: o.y, w: o.w, h: o.h, angle: o.angle || 0 }));
    }

    function rememberSelectedFont(fontId) {
      try {
        localStorage.setItem(STORAGE_SELECTED_FONT, fontId);
      } catch (_) {}
    }

    function restoreSelectedFontId() {
      let saved = null;
      try {
        saved = localStorage.getItem(STORAGE_SELECTED_FONT);
      } catch (_) {}
      if (saved === 'default') saved = 'builtin-sourcehan-light';
      if (saved && FONT_FAMILIES[saved]) {
        fontSelect.value = saved;
        previousFontValue = saved;
      } else {
        fontSelect.value = 'builtin-sourcehan-light';
        previousFontValue = 'builtin-sourcehan-light';
      }
      globalStyle.fontId = previousFontValue;
    }

    function getStateSnapshot() {
      return {
        body: bodyInput.value,
        globalStyle: { ...globalStyle },
        baseImageSrc,
        selected,
        multiSelected: multiSelected.slice(),
        textLayers: cloneTextLayers(),
        overlayLayers: cloneOverlayLayers()
      };
    }

    function stateSignature(state) {
      return JSON.stringify(state);
    }

    function pushHistory() {
      if (isApplyingHistory) return;
      const state = getStateSnapshot();
      const last = historyStack[historyStack.length - 1];
      if (!last || stateSignature(last) !== stateSignature(state)) {
        historyStack.push(state);
        redoStack.length = 0;
      }
      if (historyStack.length > 80) historyStack.shift();
    }

    async function applyState(state) {
      isApplyingHistory = true;

      bodyInput.value = state.body;
      autoGrowBodyInput();
      const remembered = globalStyle.fontId;
      globalStyle.styleId = state.globalStyle && STYLE_CONFIGS[state.globalStyle.styleId] ? state.globalStyle.styleId : globalStyle.styleId;
      globalStyle.fontId = state.globalStyle && FONT_FAMILIES[state.globalStyle.fontId] ? state.globalStyle.fontId : remembered;
      globalStyle.panelAlpha = state.globalStyle && typeof state.globalStyle.panelAlpha === 'number' ? Math.max(0, Math.min(1, state.globalStyle.panelAlpha)) : globalStyle.panelAlpha;
      styleSelect.value = globalStyle.styleId;
      fontSelect.value = globalStyle.fontId;
      alphaRange.value = String(Math.round(globalStyle.panelAlpha * 100));
      alphaValue.textContent = `${alphaRange.value}%`;
      previousFontValue = globalStyle.fontId;

      baseImageSrc = state.baseImageSrc || '';
      try {
        baseImage = await loadImageFromSrc(baseImageSrc);
        setCanvasSizeFromImage(baseImage);
      } catch (_) {
        baseImage = null;
      }

      textLayers = Array.isArray(state.textLayers) ? state.textLayers.map(t => ({ ...t })) : [];
      const overlays = Array.isArray(state.overlayLayers) ? state.overlayLayers : [];
      const loaded = [];
      for (const o of overlays) {
        try {
          const img = await loadImageFromSrc(o.src);
          if (img) loaded.push({ ...o, img });
        } catch (_) {}
      }
      overlayLayers = loaded;

      selected = state.selected || null;
      multiSelected = Array.isArray(state.multiSelected) ? state.multiSelected.slice() : [];
      activeGuides = [];
      render();
      syncControlsFromSelectedText();
      updateMultiToolbar();
      isApplyingHistory = false;
    }

    async function undoLastStep() {
      if (historyStack.length <= 1) return;
      const current = historyStack.pop();
      redoStack.push(current);
      const prev = historyStack[historyStack.length - 1];
      await applyState(prev);
    }

    async function redoNextStep() {
      if (!redoStack.length) return;
      const next = redoStack.pop();
      historyStack.push(next);
      await applyState(next);
    }

    function snapAngleToFlat(rawAngle) {
      const snapStep = Math.PI;
      const target = Math.round(rawAngle / snapStep) * snapStep;
      return Math.abs(rawAngle - target) <= 0.07 ? target : rawAngle;
    }

    function pointerToCanvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function refreshTextLayersFromTextarea() {
      const previous = cloneTextLayers();
      syncTextLayers(parseLines());
      for (let i = 0; i < Math.min(previous.length, textLayers.length); i += 1) {
        textLayers[i].x = previous[i].x;
        textLayers[i].y = previous[i].y;
        textLayers[i].scale = previous[i].scale;
        textLayers[i].angle = previous[i].angle || 0;
        textLayers[i].styleOverride = previous[i].styleOverride || null;
        textLayers[i].fontOverride = previous[i].fontOverride || null;
        textLayers[i].panelAlphaOverride = typeof previous[i].panelAlphaOverride === 'number' ? previous[i].panelAlphaOverride : null;
        textLayers[i].textColorOverride = previous[i].textColorOverride || null;
        textLayers[i].align = previous[i].align || 'left';
        textLayers[i].isPlaceholder = !!previous[i].isPlaceholder;
      }
      updateMultiToolbar();
    }

    function getLayoutBySelected(sel) {
      if (!sel) return null;
      if (sel.kind === 'text') return textLayouts[sel.index] || null;
      if (sel.kind === 'overlay') return overlayLayouts[sel.index] || null;
      return null;
    }

    function syncControlsFromSelectedText() {
      const sel = getSelectedTextLayer();
      if (!sel) {
        styleSelect.value = globalStyle.styleId;
        fontSelect.value = globalStyle.fontId;
        alphaRange.value = String(Math.round(globalStyle.panelAlpha * 100));
        alphaValue.textContent = `${alphaRange.value}%`;
        previousFontValue = globalStyle.fontId;
        return;
      }
      const s = getEffectiveStyleId(sel);
      const f = getEffectiveFontId(sel);
      const a = getEffectivePanelAlpha(sel);
      styleSelect.value = s;
      fontSelect.value = f;
      alphaRange.value = String(Math.round(a * 100));
      alphaValue.textContent = `${alphaRange.value}%`;
      previousFontValue = f;
    }

    function removeSelectedLayer() {
      if (!selected) return;
      pushHistory();
      if (selected.kind === 'text' && textLayers[selected.index]) {
        textLayers.splice(selected.index, 1);
        bodyInput.value = textLayers.map(v => v.text).join('\n');
        autoGrowBodyInput();
      } else if (selected.kind === 'overlay' && overlayLayers[selected.index]) {
        overlayLayers.splice(selected.index, 1);
      }
      selected = null;
      multiSelected = [];
      render();
      syncControlsFromSelectedText();
      updateMultiToolbar();
      pushHistory();
    }

    function layoutEdges(layout) {
      return {
        left: layout.cx - layout.w / 2,
        right: layout.cx + layout.w / 2,
        top: layout.cy - layout.h / 2,
        bottom: layout.cy + layout.h / 2,
        cx: layout.cx,
        cy: layout.cy,
        w: layout.w,
        h: layout.h
      };
    }

    function getAllLayoutsExcept(excludeKind, excludeIndex) {
      const out = [];
      for (let i = 0; i < textLayouts.length; i += 1) {
        if (excludeKind === 'text' && i === excludeIndex) continue;
        out.push(layoutEdges(textLayouts[i]));
      }
      for (let i = 0; i < overlayLayouts.length; i += 1) {
        if (excludeKind === 'overlay' && i === excludeIndex) continue;
        out.push(layoutEdges(overlayLayouts[i]));
      }
      return out;
    }

    function getEqualSpacingSnapForText(index, nextX, nextY, w, h) {
      const moving = {
        left: nextX,
        right: nextX + w,
        top: nextY,
        bottom: nextY + h,
        cx: nextX + w / 2
      };
      const others = [];
      for (let i = 0; i < textLayouts.length; i += 1) {
        if (i === index) continue;
        others.push(layoutEdges(textLayouts[i]));
      }
      if (others.length < 2) return null;

      const overlapEnough = (o) => {
        const overlap = Math.min(moving.right, o.right) - Math.max(moving.left, o.left);
        return overlap >= Math.min(w, o.w) * 0.25;
      };

      let topNeighbor = null;
      let bottomNeighbor = null;
      for (const o of others) {
        if (!overlapEnough(o)) continue;
        if (o.bottom <= moving.top) {
          if (!topNeighbor || o.bottom > topNeighbor.bottom) topNeighbor = o;
        }
        if (o.top >= moving.bottom) {
          if (!bottomNeighbor || o.top < bottomNeighbor.top) bottomNeighbor = o;
        }
      }
      if (!topNeighbor || !bottomNeighbor) return null;

      // 公式：gapTop = top - topNeighbor.bottom, gapBottom = bottomNeighbor.top - (top + h)
      // 令 gapTop == gapBottom，可得 targetTop = (bottomNeighbor.top + topNeighbor.bottom - h) / 2
      const targetTop = (bottomNeighbor.top + topNeighbor.bottom - h) / 2;
      const gapThreshold = 8;
      const near = Math.abs(nextY - targetTop) <= gapThreshold;
      if (!near) return null;

      const snappedTop = Math.max(0, Math.min(canvas.height - h, targetTop));
      const cx = moving.cx;
      const guides = [
        { x1: cx, y1: topNeighbor.bottom, x2: cx, y2: snappedTop },
        { x1: cx, y1: snappedTop + h, x2: cx, y2: bottomNeighbor.top }
      ];
      return { y: snappedTop, guides };
    }

    function triggerSnapHaptic(key) {
      if (snapState.hapticKey === key) return;
      snapState.hapticKey = key;
      try {
        if (navigator.vibrate) navigator.vibrate(8);
      } catch (_) {}
    }

    function resetSnapState() {
      snapState = { x: null, y: null, hapticKey: '' };
    }

    function snapAxis(axis, candidates, anchors, moving, currentPos) {
      const enterThreshold = isMobileUI() ? 12 : 8;
      const releaseThreshold = isMobileUI() ? 22 : 16;
      let best = null;
      for (const anchor of anchors) {
        const anchorV = moving[anchor];
        for (const t of candidates) {
          const d = t.value - anchorV;
          const ad = Math.abs(d);
          if (ad <= releaseThreshold && (!best || ad < best.delta)) {
            best = { delta: ad, move: d, guideValue: t.value, anchor, key: `${axis}:${anchor}:${t.key}:${Math.round(t.value)}` };
          }
        }
      }

      const locked = snapState[axis];
      if (locked) {
        const lockAnchor = moving[locked.anchor];
        const d = locked.value - lockAnchor;
        if (Math.abs(d) <= releaseThreshold) {
          triggerSnapHaptic(locked.key);
          return { pos: currentPos + d, guideValue: locked.value, locked: true };
        }
        snapState[axis] = null;
      }

      if (!best) return { pos: currentPos, guideValue: null, locked: false };

      if (best.delta <= enterThreshold) {
        snapState[axis] = { value: best.guideValue, anchor: best.anchor, key: best.key };
        triggerSnapHaptic(best.key);
        return { pos: currentPos + best.move, guideValue: best.guideValue, locked: true };
      }

      // Outside the snap circle but near it: add light resistance instead of a hard jump.
      return { pos: currentPos + best.move * 0.38, guideValue: best.guideValue, locked: false };
    }

    function snapMoveWithGuides(kind, index, nextX, nextY, w, h) {
      const moving = {
        left: nextX,
        right: nextX + w,
        top: nextY,
        bottom: nextY + h,
        cx: nextX + w / 2,
        cy: nextY + h / 2,
        w,
        h
      };
      const others = getAllLayoutsExcept(kind, index);
      const xCandidates = [{ key: 'center-x', value: canvas.width / 2 }];
      const yCandidates = [{ key: 'center-y', value: canvas.height / 2 }];

      for (const o of others) {
        xCandidates.push({ key: 'left', value: o.left });
        xCandidates.push({ key: 'right', value: o.right });
        xCandidates.push({ key: 'cx', value: o.cx });
        yCandidates.push({ key: 'top', value: o.top });
        yCandidates.push({ key: 'bottom', value: o.bottom });
        yCandidates.push({ key: 'cy', value: o.cy });
      }

      const snappedX = snapAxis('x', xCandidates, ['left', 'right', 'cx'], moving, nextX);
      const moveX = snappedX.pos - nextX;
      nextX = snappedX.pos;
      moving.left += moveX;
      moving.right += moveX;
      moving.cx += moveX;

      const snappedY = snapAxis('y', yCandidates, ['top', 'bottom', 'cy'], moving, nextY);
      const moveY = snappedY.pos - nextY;
      nextY = snappedY.pos;
      moving.top += moveY;
      moving.bottom += moveY;
      moving.cy += moveY;

      const guides = [];
      if (snappedX.guideValue !== null) guides.push({ x1: snappedX.guideValue, y1: 0, x2: snappedX.guideValue, y2: canvas.height });
      if (snappedY.guideValue !== null) guides.push({ x1: 0, y1: snappedY.guideValue, x2: canvas.width, y2: snappedY.guideValue });

      if (kind === 'text') {
        const spacing = getEqualSpacingSnapForText(index, nextX, nextY, w, h);
        if (spacing) {
          nextY = spacing.y;
          guides.push(...spacing.guides);
        }
      }
      activeGuides = guides;
      if (!guides.length) snapState.hapticKey = '';

      return { x: nextX, y: nextY };
    }

    function setKeyboardOffset() {
      if (!window.visualViewport) {
        document.documentElement.style.setProperty('--immersive-keyboard-offset', '0px');
        return;
      }
      const offset = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
      document.documentElement.style.setProperty('--immersive-keyboard-offset', `${Math.round(offset)}px`);
    }

    function focusImmersiveInput() {
      try { immersiveTextInput.focus({ preventScroll: true }); } catch (_) { immersiveTextInput.focus(); }
      window.requestAnimationFrame(() => {
        try { immersiveTextInput.focus({ preventScroll: true }); } catch (_) { immersiveTextInput.focus(); }
        if (immersiveTextInput.value) immersiveTextInput.select();
      });
    }

    function syncBodyInputFromTextLayers() {
      bodyInput.value = textLayers.filter(v => !v.isPlaceholder).map(v => v.text).join('\n');
      autoGrowBodyInput();
    }

    function getCurrentTextFontSize(layer) {
      const baseFont = isMobileUI() ? FONT_UI.baseMobile : FONT_UI.baseDesktop;
      return Math.round(baseFont * ((layer && layer.scale) || 1));
    }

    function setCurrentTextFontSize(fontSize) {
      const layer = getSelectedTextLayer();
      if (!layer) return;
      const baseFont = isMobileUI() ? FONT_UI.baseMobile : FONT_UI.baseDesktop;
      const next = Math.max(FONT_UI.min, Math.min(FONT_UI.max, Number(fontSize) || baseFont));
      layer.scale = Math.max(SCALE_UI.min, Math.min(SCALE_UI.max, next / baseFont));
      immersiveSizeSlider.value = String(Math.round(baseFont * layer.scale));
      updateImmersiveSizeVisual();
      render();
    }

    function updateImmersiveSizeVisual() {
      const value = Math.max(FONT_UI.min, Math.min(FONT_UI.max, Number(immersiveSizeSlider.value) || FONT_UI.baseMobile));
      const ratio = (value - FONT_UI.min) / Math.max(1, FONT_UI.max - FONT_UI.min);
      const pos = 1 - ratio;
      immersiveSizeControl.style.setProperty('--immersive-size-pos', String(pos));
      immersiveSizeControl.setAttribute('aria-valuenow', String(Math.round(value)));
    }

    function setSizeFromControlPoint(clientY) {
      const rect = immersiveSizeControl.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientY - rect.top) / Math.max(1, rect.height)));
      const value = FONT_UI.max - ratio * (FONT_UI.max - FONT_UI.min);
      immersiveSizeSlider.value = String(Math.round(value));
      setCurrentTextFontSize(value);
      immersiveDirty = true;
    }

    function createCenteredTextLayer(text = '双击输入文字', isPlaceholder = true) {
      const layer = makeTextLayer(text, undefined, undefined, null, { isPlaceholder });
      textLayers.push(layer);
      selected = { kind: 'text', index: textLayers.length - 1 };
      multiSelected = [];
      syncBodyInputFromTextLayers();
      render();
      syncControlsFromSelectedText();
      return selected.index;
    }

    function createTextLayerAfterCurrent() {
      if (immersiveEditIndex < 0 || !textLayers[immersiveEditIndex]) return;
      const current = textLayers[immersiveEditIndex];
      const currentText = immersiveTextInput.value.trim();
      current.text = currentText || '双击输入文字';
      current.isPlaceholder = !currentText;
      render();
      const layout = textLayouts[immersiveEditIndex] || { h: getCurrentTextFontSize(current) * 1.2 };
      const nextY = Math.max(0, Math.min(canvas.height - 56, current.y + layout.h + 14));
      const next = makeTextLayer('双击输入文字', current.x, nextY, current, { isPlaceholder: true });
      textLayers.splice(immersiveEditIndex + 1, 0, next);
      immersiveEditIndex += 1;
      selected = { kind: 'text', index: immersiveEditIndex };
      immersiveCreatedCount = 0;
      immersiveTextInput.value = '';
      syncBodyInputFromTextLayers();
      syncControlsFromSelectedText();
      updateImmersiveControls({ keepInput: true });
      immersiveDirty = true;
      render();
    }

    function applyTextLinesFromImmersiveInput() {
      if (immersiveEditIndex < 0 || !textLayers[immersiveEditIndex]) return;
      const rawLines = immersiveTextInput.value.split('\n');
      const lines = rawLines.map(v => v.trim()).filter(Boolean);
      const safeLines = lines.length ? lines : [''];
      const base = textLayers[immersiveEditIndex];
      const baseY = base.y;
      textLayers.splice(immersiveEditIndex + 1, immersiveCreatedCount);
      base.text = safeLines[0] || '双击输入文字';
      base.isPlaceholder = !safeLines[0];
      immersiveCreatedCount = 0;
      render();
      const baseLayout = textLayouts[immersiveEditIndex] || { h: getCurrentTextFontSize(base) * 1.2 };
      let nextY = baseY + baseLayout.h + 14;
      for (let i = 1; i < safeLines.length; i += 1) {
        const clone = makeTextLayer(safeLines[i], base.x, nextY, base);
        textLayers.splice(immersiveEditIndex + i, 0, clone);
        immersiveCreatedCount += 1;
        nextY += Math.max(36, baseLayout.h + 14);
      }
      selected = { kind: 'text', index: immersiveEditIndex + safeLines.length - 1 };
      if (safeLines.length > 1) {
        immersiveEditIndex = selected.index;
        immersiveCreatedCount = 0;
      }
      syncBodyInputFromTextLayers();
      syncControlsFromSelectedText();
      updateImmersiveControls();
      render();
      immersiveDirty = true;
    }
